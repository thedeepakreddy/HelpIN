# Render Blueprint: one web service (API + worker + web app) in Frankfurt, see docs/08-deploy.md.
# The database is external (Neon's free Postgres); paste its connection string as DATABASE_URL.
# Values marked `sync: false` are asked for in the Render dashboard and never live in this file.

services:
  - type: web
    name: helpin
    runtime: node
    region: frankfurt
    plan: free # sleeps after ~15 idle minutes; use `starter` for an always-on beta
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile --prod=false && npx --yes pnpm@10.28.0 --filter @helpin/web build
    startCommand: ./node_modules/.bin/tsx apps/api/src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon: the direct (not pooled) connection string
      - key: JWT_SECRET
        generateValue: true
      # The API serves the web app and runs the worker; addresses come from RENDER_EXTERNAL_URL.
      - key: WEB_DIST
        value: apps/web/dist
      - key: RUN_WORKER
        value: "true"

      # SMS sign-in codes. Until Twilio is set up, codes are written to the Render log (private
      # test). Later: SMS_PROVIDER=twilio, add TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM,
      # and remove CODES_IN_LOGS.
      - key: SMS_PROVIDER
        value: console
      - key: CODES_IN_LOGS
        value: "true"

      # Email (Brevo, docs/07-email-and-storage.md)
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Photos (Cloudflare R2, docs/07-email-and-storage.md)
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # Your email: becomes the admin account when you sign in with it (ADR-023)
      - key: ADMIN_EMAILS
        sync: false
